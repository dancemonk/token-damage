<!doctype html>
<html lang="{{v:lang}}">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>{{v:title}}</title>
    <meta name="description" content="{{v:description}}" />
    <link rel="canonical" href="{{v:canonical}}" />
    {{h:alternates}}
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Token Damage" />
    <meta property="og:title" content="{{v:title}}" />
    <meta property="og:description" content="{{v:description}}" />
    <meta property="og:url" content="{{v:canonical}}" />
    <meta property="og:locale" content="{{v:ogLocale}}" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0e0e0d" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/assets/fonts/ibm-plex-mono-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/assets/site.css" />
    {{h:scripts}}
  </head>
  <body>
    {{h:body}}
  </body>
</html>
