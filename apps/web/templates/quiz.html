<main class="sheet-wrap narrow">
  <div class="sheet-edge top"></div>
  <div class="sheet">
    <header class="quiz-head">
      <h1 class="t">{{t:quiz.title}}</h1>
      <div class="s">{{t:quiz.subtitle}}</div>
    </header>
    <div class="quiz" id="quiz" hidden></div>
    <div class="quiz quiz-static" id="quiz-static">{{h:staticQuiz}}</div>
    <p class="q-source">{{v:asOf}}</p>
  </div>
  <div class="sheet-edge"></div>
</main>
