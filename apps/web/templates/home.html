<div class="home">
  {{h:header}}
  <div class="printer" aria-hidden="true">
    <div class="slot"></div>
    <span class="led" id="led"></span>
  </div>
  <div class="strip" aria-hidden="true"></div>
  <div class="hint" id="hint" aria-hidden="true"></div>
  <main class="stage" id="stage">
    <h1 class="visually-hidden">{{v:title}}</h1>
    <div class="specks" id="specks" aria-hidden="true"></div>
    <div class="falling" id="falling" aria-hidden="true"></div>
    <div class="hang">
      <div class="drag" id="drag">
        <div class="feed" id="feed">
          <div id="group">
            <section
              class="receipt"
              id="receipt"
              aria-label="{{t:home.receipt.label}}"
            >
              {{h:receipt}}
            </section>
            <div class="stub-wrap">
              {{h:stub}}
              <div class="copied" id="copied" role="status"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <aside class="wire fade" style="animation-delay: 1.8s">
    <p class="news" id="news">{{h:news}}</p>
  </aside>
  <footer class="home-foot fade" style="animation-delay: 1.8s">
    <div class="pullrow">
      <button type="button" class="nx" id="next">{{t:home.next}}</button>
    </div>
    <div>{{t:footer.local}}</div>
    <div class="faint">{{t:footer.affiliation}}</div>
    {{h:langs}}
  </footer>
</div>
