name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # npm provenance: the registry verifies this build came from this repo and workflow.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/core packages/cli; do
            v=$(node -p "require('./$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "$p is $v but the tag is $tag"; exit 1; }
          done
      - run: pnpm -F token-damage build
      # pnpm pack turns workspace:* into the real version; npm publish then adds provenance.
      - name: Pack
        run: |
          mkdir -p out
          pnpm -F @token-damage/core pack --pack-destination "$PWD/out"
          pnpm -F token-damage pack --pack-destination "$PWD/out"
          ls out
      - name: Publish core, then the CLI (skips versions already on npm)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish() {
            name=$(tar -xOzf "$1" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).name")
            if npm view "$name@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
              echo "$name@${GITHUB_REF_NAME#v} is already on npm, skipping"
            else
              npm publish "$1" --provenance --access public
            fi
          }
          publish out/token-damage-core-*.tgz
          publish out/token-damage-[0-9]*.tgz
